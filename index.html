		async function handleEventMove(info) 
		{
		    const event = info.event;
		
		    // Use the real SQL event ID

		    // New start time (full ISO)

		    // Find the event in monthData

		        console.warn("Event not found in monthData:", id);
		        return;
		    }
		
		    // If the event has an end date, preserve duration
		    if (evt.end) 
			{
		        const oldStart = new Date(evt.start);
		        const oldEnd = new Date(evt.end);
		        const duration = oldEnd - oldStart;
		        const newEnd = new Date(event.start.getTime() + duration);
		        evt.end = newEnd;
		    }
			
		    // Update local copy
		    evt.start = newStart;
		
		    // --- SQL WRITE-BACK ---

		// LOAD all info from the SQL Database
		async function loadMonthEvents(date) 
		{
		    const year = date.getFullYear();
		    const month = String(date.getMonth() + 1);
			data.dailyLocations = {};
			
		    // 1. Load the Vac_Trip record for this year/month
		    const tripRes = await fetch(`${SUPABASE_URL}/Vac_Trip?Trip_Year=eq.${year}&Trip_Month=eq.${month}`,
		    { 
				headers: { apikey: SUPABASE_KEY } 
			});
		    const tripRows = await tripRes.json();

		    if (tripRows.length === 0) 
			{
		        // No trip found for this month
		        monthData = {};
		        calendar.removeAllEvents();
		        document.querySelector('h1').textContent = "";
		        document.getElementById('route-map-icon').classList.add('hidden');
		        document.getElementById('route-map-icon').dataset.mapSrc = "";
		        return;
		    }

		    const trip = tripRows[0];
		    const tripId = trip.id;
			CURRENT_TRIP_ID = tripId;

			
		    // 2. Load daily Vac_Location 
		    const locRes = await fetch(`${SUPABASE_URL}/Vac_Location?trip_id=eq.${tripId}`,
		    { 
				headers: { apikey: SUPABASE_KEY } 
			});
		    const dailyLocationsRows = await locRes.json();
	
		    // Convert SQL rows → your original JSON structure
    		dailyLocationsRows.forEach(row => 
			{
        		data.dailyLocations[row.Location_Date] = 
				{
				    id: row.id,
				    text: row.Location_Loc
				};
    		});
				
		    // 3. Load Vac_Events
		    const eventsRes = await fetch(`${SUPABASE_URL}/Vac_Events?trip_id=eq.${tripId}`,
		    { 
				headers: { apikey: SUPABASE_KEY } 
			});
			// Convert SQL fields → FullCalendar fields
		    const rawEvents = await eventsRes.json();
			const events = rawEvents.map(e => (
			{
			    id: e.id,
			    title: e.Event_Description,
			    start: e.Event_StartDate,
			    end: e.Event_EndDate,
			    className: e.Event_Type,
			    url: e.Event_Url
			}));
			
		    // Build monthData in the same shape your calendar already expects
		    monthData = 
			{
		        tripTitle: trip.Trip_Title,
		        backgroundImage: trip.Trip_BkgndImage,
		        routeMap: trip.Trip_RouteMap,
		        dailyLocations: data.dailyLocations,
		        events: events
		    };

		    // --- Your existing calendar logic stays exactly the same ---
		    calendar.removeAllEvents();
			calendar.addEventSource(events);
			
		    // Re-run dayCellContent without triggering datesSet
		    const currentView = calendar.view.type;
		    calendar.changeView(currentView);
	
		    // Update title
		    document.querySelector('h1').textContent = trip.Trip_Title || "";

		    // Update background image
		    if (trip.Trip_BkgndImage) 
			{
		        document.getElementById('background-layer').style.backgroundImage = `url('${trip.Trip_BkgndImage}')`;
		    }

		    // Update route map icon
		    const icon = document.getElementById('route-map-icon');
		    if (trip.Trip_RouteMap) 
			{
		        icon.classList.remove('hidden');
		        icon.dataset.mapSrc = trip.Trip_RouteMap;
		    } else 
			{
		        icon.classList.add('hidden');
		        icon.dataset.mapSrc = "";
		    }
		}

		async function saveMonthChanges() 
		{
		    const updates = monthData.events.filter(e => e._dirty);
			
		    if (updates.length === 0) 
			{
		        console.log("No changes to save.");
		        return;
		    }
		
		    for (const evt of updates) 
			{
		        const payload = 
				{
		            start: evt.start,
		            end: evt.end || null,
		            Modified_Date: new Date().toISOString()
		        };
		
		        const res = await fetch( `${SUPABASE_URL}/Vac_Events?id=eq.${evt.id}`,
				{
					method: "PATCH",
					headers: {apikey: SUPABASE_KEY, "Content-Type": "application/json"},
					body: JSON.stringify(payload)
				});
		
		        if (!res.ok) 
				{
		            console.error("Failed to update event:", evt.id);
		        } 
				else 
				{
		            evt._dirty = false; // mark as saved
		        }
		    }
		    console.log("All changes saved.");
		}

				const year = info.start.getFullYear();
				const month = info.end.getMonth();
				
				// Only load JSON if the visible month actually changed
				if (year !== lastLoadedYear || month !== lastLoadedMonth) 
				{
					lastLoadedYear = year;
					lastLoadedMonth = month;
					loadMonthEvents(info.start);
				}

			dayCellContent: function(arg) 
			{
				const dateStr = arg.date.toISOString().substring(0, 10);
				const location = data.dailyLocations[dateStr];
				const text = typeof location === "string" ? location : location?.text;
				
				if (!text) 
				{
					return { html: `<div class="fc-day-number">${arg.dayNumberText}</div>` };
				}
		
			    return {
			        html: `<div class="day-location">${text}</div>
