<script>
	//********************************
	// JAVASCRIPT CODE HERE          *
	//********************************
	let calendar;
	let currentEvent = null;
	let bgFile = null;
	let mapFile = null;
	let editBgFile = null;
	let editMapFile = null;
	let removeBg = false;
	let removeMap = false;
	let CURRENT_TRIP_ID = null;	
	let READ_ONLY_MODE = true;
	let DUPLICATE_MODE = false;
	let longPressTimer = null;
	let data = {dailyLocations: {} };
	let monthData = 
	{
	    tripTitle: null,
	    backgroundImage: null,
	    routeMap: null,
	    dailyLocations: {},
	    events: []
	};
	let activeCategories = 
	{
		"event-hotel": true,
		"event-flight": true,
		"event-tour": true,
		"event-meal": true,
		"event-trans": true,
		"event-misc": true
	};
	const SUPABASE_BASE ="https://iqogmlimzhbgvzfcghov.supabase.co";
	const SUPABASE_URL = SUPABASE_BASE + "/rest/v1";
	const SUPABASE_KEY = "sb_publishable_QsOmU7mppQgzKQ51xFDuIA_qLsYesU9";
	const sb = window.supabase.createClient(SUPABASE_BASE, SUPABASE_KEY);
	
	function openModal(htmlContent) 
	{
	    const overlay = document.getElementById("modal-overlay");
	    const modal = document.getElementById("modal");
	    const content = document.getElementById("modal-content");

	    content.innerHTML = htmlContent;
	
	    overlay.classList.remove("hidden");
	    modal.classList.remove("hidden");

		requestAnimationFrame(() => 
		{
		    overlay.classList.add("visible");
	    	modal.classList.add("visible");
		});
	}

	function closeModal() 
	{
	    const overlay = document.getElementById("modal-overlay");
	    const modal = document.getElementById("modal");

	    overlay.classList.add("hidden");
	    modal.classList.add("hidden");
	
	    overlay.classList.remove("visible");
	    modal.classList.remove("visible");
		
		modal.style.top = "30%";
		modal.style.left = "38%";
		modal.style.transform = "translate(-50%, -50%) scale(0.95)";
		modal.style.width = "420px";
		modal.style.padding = "25px";
		modal.style.maxHeight = "none"; 
		modal.style.maxWidth = "unset";	
		modal.style.height = "none";	
	}
	
	function updateSmartLegend() 
	{
	    const events = calendar.getEvents();
	    const counts = {};	    // Count events by className
	
	    events.forEach(ev => 
		{
	        const type = ev.classNames[0];   // e.g., "event-meal"
	        if (!counts[type]) 
				counts[type] = 0;
	        counts[type]++;

	function toLocalDateTimeString(date) 
	{
		const pad = n => String(n).padStart(2, '0');
		return (
			date.getFullYear() + "-" +
			pad(date.getMonth() + 1) + "-" +
			pad(date.getDate()) + "T" +
			pad(date.getHours()) + ":" +
			pad(date.getMinutes()) + ":00"
		);
	}

	function setupDropzone(zoneId, previewId, callback) 
	{
	    const zone = document.getElementById(zoneId);
	    const preview = document.getElementById(previewId);
	
	    zone.addEventListener("click", () => 
		{
	        const input = document.createElement("input");
	        input.type = "file";
	        input.accept = "image/*";
	        input.onchange = () => 
			{
	            const file = input.files[0];
	            preview.src = URL.createObjectURL(file);
	            preview.classList.remove("hidden");
	            callback(file);
	        };
	        input.click();
	    });
	
	    zone.addEventListener("dragover", (e) => 
		{
	        e.preventDefault();
	        zone.classList.add("dragover");
	    });
	
	    zone.addEventListener("dragleave", () => 
		{
	        zone.classList.remove("dragover");
	    });
	
	    zone.addEventListener("drop", (e) => 
		{
	        e.preventDefault();
	        zone.classList.remove("dragover");
	
	        const file = e.dataTransfer.files[0];
	        preview.src = URL.createObjectURL(file);
	        preview.classList.remove("hidden");
	        callback(file);
	    });
	}

	// LOAD all info from the SQL Database
	async function loadMonthEvents(date)  //loadTrip()
	{
		const year = date.getFullYear();
		const month = String(date.getMonth() + 1);
		data.dailyLocations = {};
 
		document.querySelectorAll('.legend-item').forEach(item => 
		{
			const category = item.dataset.category;
			activeCategories[category] = true;		// Toggle active state
			item.classList.remove('inactive');		// Toggle visual style
		});

		// 1. Load the Vac_Trip record for this year/month
		const tripRes = await fetch(`${SUPABASE_URL}/Vac_Trip?Trip_Year=eq.${year}&Trip_Month=eq.${month}`,
		{ 
			headers: { apikey: SUPABASE_KEY } 
		});
		
		const tripRows = await tripRes.json();		
		if (tripRows.length === 0) 
		{
			// No trip found for this month
			monthData = 
			{
				tripTitle: null,
			    backgroundImage: null,
			    routeMap: null,
			    dailyLocations: {},
			    events: []
			};
			CURRENT_TRIP_ID = null;
			calendar.removeAllEvents();

			document.querySelector('h1').textContent = "no trip";
			document.getElementById("trip-title").classList.add("clickable");
			document.getElementById('route-map-icon').classList.add('hidden');
			document.getElementById('route-map-icon').dataset.mapSrc = "";
			document.getElementById('background-layer').style.backgroundImage = null;
		    calendar.changeView("dayGridMonth");// Force month grid view when no events exist
			return;
		}
		
		const trip = tripRows[0];
		const tripId = trip.id;
		CURRENT_TRIP_ID = tripId;

		// 2. Load daily Vac_Location 
		const locRes = await fetch(`${SUPABASE_URL}/Vac_Location?trip_id=eq.${tripId}`,
		{ 
			headers: { apikey: SUPABASE_KEY } 
		});
		const dailyLocationsRows = await locRes.json();

		// Convert SQL rows → your original JSON structure
		dailyLocationsRows.forEach(row => 
		{
			data.dailyLocations[row.Location_Date] = 
			{
				id: row.id,
				text: row.Location_Loc
			};
		});
			
		// 3. Load Vac_Events
		const eventsRes = await fetch(`${SUPABASE_URL}/Vac_Events?trip_id=eq.${tripId}&order=Event_StartDate.asc`,
		{ 
			headers: { apikey: SUPABASE_KEY } 
		});
		// Convert SQL fields → FullCalendar fields
		const rawEvents = await eventsRes.json();
		const events = rawEvents.map(e => (
		{
			id: e.id,
			title: e.Event_Description,
			start: e.Event_StartDate,
			end: e.Event_EndDate,
			className: e.Event_Type,
			url: e.Event_Url,
			enotes: e.Event_Notes
		}));
		
		// Build monthData in the same shape your calendar already expects
		monthData = 
		{
			tripTitle: trip.Trip_Title,
			backgroundImage: trip.Trip_BkgndImage,
			routeMap: trip.Trip_RouteMap,
			dailyLocations: data.dailyLocations,
			events: events
		};

		// --- Your existing calendar logic stays exactly the same ---
		calendar.removeAllEvents();
		calendar.addEventSource(events);
		
		// Re-run dayCellContent without triggering datesSet
		const currentView = calendar.view.type;
		calendar.changeView(currentView);

		// Update background image
		if (trip.Trip_BkgndImage) 
		{
			document.getElementById('background-layer').style.backgroundImage = `url('${trip.Trip_BkgndImage}')`;
		}

		// Update title
		document.querySelector('h1').textContent = trip.Trip_Title || "";

		// Update route map icon
		const icon = document.getElementById('route-map-icon');
		if (trip.Trip_RouteMap) 
		{
			icon.classList.remove('hidden');
			icon.dataset.mapSrc = trip.Trip_RouteMap;
		} 
		else 
		{
			icon.classList.add('hidden');
			icon.dataset.mapSrc = "";
		}
		const header = document.getElementById("trip-title");
		header.classList.remove("clickable");
		applyReadOnlyMode();
		updateSmartLegend();
	}

	async function saveNewEvent() 
	{
		const title = document.getElementById("new-event-title").value.trim();
		const start = document.getElementById("new-event-start").value;
		const end   = document.getElementById("new-event-end").value || null;
		const url   = document.getElementById("new-event-url").value.trim() || null;
		const category = document.getElementById('new-event-category').value;
		const enotes = document.getElementById('new-event-notes').value.trim();

		// 1. Basic validation
		if (!title || !start) 
		{
			alert("Please enter at least a Title and Start Date.");
			return;
		}
		
		// 2. Add event to FullCalendar immediately
		const newEvent = calendar.addEvent(
		{
			title: title,
			start: start,
			end: end || null,
			className: category,
			url: url || null,
			enotes: enotes || null
		});

		// 3. Add event to your monthData array (for drag/resize tracking)
		const newEventObj = 
		{
			id: null,                 // will be filled after Supabase INSERT
			title: title,
			start: start,
			end: end,
			className: category,
			url: url,
			enotes: enotes,
			_dirty: false             // new events are not dirty
		};
	
		monthData.events.push(newEventObj);

		// 4. INSERT into Supabase
		try 
		{
			const payload = 
			{
				trip_id: CURRENT_TRIP_ID,        // <-- your trip ID variable
				Event_Type: category,
				Event_StartDate: start,
				Event_EndDate: end,
				Event_Description: title,
				Event_Url: url,
				Event_Notes: enotes
			};
			const res = await fetch(`${SUPABASE_URL}/Vac_Events`, 
			{
				method: "POST",
				headers: 
				{
					apikey: SUPABASE_KEY,
					"Content-Type": "application/json",
					Prefer: "return=representation"
				},
				body: JSON.stringify(payload)
			});
	
			if (!res.ok) 
			{
				console.error("Supabase INSERT failed:", await res.text());
				alert("Error saving event to database.");
			} 
			else 
			{
				const inserted = await res.json();		
				// Supabase returns the new row including its ID
				newEventObj.id = inserted[0].id;	// for monthData
				newEvent.setExtendedProp("db_id", inserted[0].id);  // for FullCalendar
				console.log("Event inserted:", inserted[0]);
			}
		} 
		catch (err) 
		{
			console.error("Supabase error:", err);
			alert("Database error while saving event.");
		}
		closeModal();
	}

	// ************** DELETE EVENT *************
	async function deleteEvent(event) 
	{
		const dbId = event.id;

		if (!dbId) 
		{
			alert("Cannot delete: event has no database ID.");
			return;
		}
	
		// 1. Delete from Supabase
		try 
		{
			const res = await fetch(`${SUPABASE_URL}/Vac_Events?id=eq.${dbId}`, 
			{
				method: "DELETE",
				headers: 
				{
					apikey: SUPABASE_KEY,
					"Content-Type": "application/json"
				}
			});
	
			if (!res.ok) 
			{
				console.error("Supabase DELETE failed:", await res.text());
				alert("Error deleting event from database.");
				return;
			}
			
			// 2. Remove from FullCalendar
			event.remove();
		
			// 3. Remove from monthData.events
			//monthData.events = monthData.events.filter(e => e.id !== dbId);
			const idx = monthData.events.findIndex(e => e.id === dbId);
			if (idx !== -1) 
				monthData.events.splice(idx, 1);
		
			// 4. Close popup
			closeModal();
		} 
		catch (err) 
		{
			console.error("Supabase error:", err);
			alert("Database error while deleting event.");
			return;
		}
	};

	async function saveEditedEvent(event) 
	{
		const dbId	   = document.getElementById("edit-db-id").value;
		const title    = document.getElementById("edit-title").value.trim();
		const start    = document.getElementById("edit-start").value;
		const end      = document.getElementById("edit-end").value || null;
		const url      = document.getElementById("edit-url").value.trim() || null;
		const category = document.getElementById("edit-category").value;
		const enotes   = document.getElementById("edit-notes").value.trim();
	
		if (!title || !start) 
		{
			alert("Please enter at least a Title and Start Date.");
			return;
		}
	
		// Update FullCalendar event
		event.setProp("title", title);
		event.setStart(start);
		event.setEnd(end);
		event.setProp("url", url);
		event.setExtendedProp("enotes", enotes);
	
		// Update category class
		event.setProp("classNames", [category]);
		
		// Update monthData
		const md = monthData.events.find(e => e.id === dbId);
		if (md) 
		{
			md.title     = title;
			md.start     = start;
			md.end       = end;
			md.url       = url;
			md.className = category;
			md.extendedProps.enotes    = enotes;
			md._dirty    = true;
		}
	
		// Update Supabase
		try 
		{
			const payload = 
			{
				id:				   dbId,
				Event_Type:        category,
				Event_StartDate:   start,
				Event_EndDate:     end,
				Event_Description: title,
				Event_Url:         url,
				Event_Notes:	   enotes
			};
			const numID = parseInt(dbId, 10); 
			const res = await fetch(`${SUPABASE_URL}/Vac_Events?id=eq.${numID}`, 
			{
				method: "POST",
				headers: 
				{
					apikey: SUPABASE_KEY,
					Authorization: `Bearer ${SUPABASE_KEY}`,
					"Content-Type": "application/json",
					"Prefer": "resolution=merge-duplicates,return=representation"
				},
				body: JSON.stringify(payload)
			});
	
			if (!res.ok) 
			{
				console.error("Supabase UPDATE failed:", await res.text());
				alert("Error updating event in database.");
			}
		}
		catch (err) 
		{
			console.error("Supabase error:", err);
			alert("Database error while updating event.");
		}
	
		closeModal();
	}

	async function saveMonthChanges() 
	{
		const updates = monthData.events.filter(e => e._dirty);
		
		if (updates.length === 0) 
		{
			console.log("No changes to save.");
			return;
		}
	
		for (const evt of updates) 
		{
			const payload = 
			{
				start: evt.start,
				end: evt.end || null,
				Modified_Date: toLocalDateTimeString(new Date()),
				enotes: evt.extendedProps.enotes
			};
	
			const res = await fetch( `${SUPABASE_URL}/Vac_Events?id=eq.${evt.id}`,
			{
				method: "PATCH",
				headers: {apikey: SUPABASE_KEY, "Content-Type": "application/json"},
				body: JSON.stringify(payload)
			});
	
			if (!res.ok) 
			{
				console.error("Failed to update event:", evt.id);
			} 
			else 
			{
				evt._dirty = false; // mark as saved
			}
		}
		console.log("All changes saved.");
	}

	function handleEventResize(info) 
	{
		const event = info.event;	
		const id = event.id;
		const newStart = toLocalDateTimeString(event.start);
		const newEnd = event.end ? toLocalDateTimeString(event.end) : null;
	
		// Find the event in monthData
		const evt = monthData.events.find(e => e.id == id);
		if (!evt) 
		{
			console.warn("Event not found in monthData:", id);
			return;
		}
	
		// Update start and end
		evt.start = newStart;
		evt.end = newEnd;
		evt._dirty = true;   // mark this event as changed
	
		saveMonthChanges();
	}
	
	function applyReadOnlyMode()

	        calendar.setOption("selectable", false);
		} 
		else 
		{
	        calendar.setOption("editable", true);
	        calendar.setOption("eventStartEditable", true);
	        calendar.setOption("eventDurationEditable", true);
	        calendar.setOption("selectable", true);
	    }
	}
	
	async function saveDragDrop(info)
	{
		const original = info.event;

		const newEvent = 
		{
			trip_id: CURRENT_TRIP_ID,
			Event_Description: original.title,
			Event_Type: original.classNames[0],
			Event_StartDate: toLocalDateTimeString(info.event.start),
			Event_EndDate: info.event.end ? toLocalDateTimeString(info.event.end) : null,
			Event_Url: original.url || null,
			Event_Notes: original.extendedProps.enotes
		};
			info.revert();	
		// Save to Supabase
		try
		{
			const res = await fetch(`${SUPABASE_URL}/Vac_Events`, 
			{
				method: "POST",
				headers: 
				{
					apikey: SUPABASE_KEY,
					Authorization: `Bearer ${SUPABASE_KEY}`,
					"Content-Type": "application/json",
					Prefer: "return=representation"
				},
				body: JSON.stringify(newEvent)
			});					
		

			
			if (!res.ok) 
			{
				console.error("Duplicate failed", res);
			}
			else
			{
				// Add to calendar visually
				const saved = await res.json();
				calendar.addEvent(
				{
					id: saved[0].id,
					title: newEvent.Event_Description,
					start: newEvent.Event_StartDate,
					end: newEvent.Event_EndDate,
					url: newEvent.Event_Url,
					classNames: [newEvent.Event_Type],
					enotes: newEvent.Event_Notes
				});
			}
		}
		catch (err) 
		{
			console.error("Duplicate failed:", err);
			alert("Database error while saving event.");
		}			
	
		// Reset duplicate mode
		DUPLICATE_MODE = false;
	}

	{
		if (e.key === "Shift") DUPLICATE_MODE = true;  // Alt, Shift, Control
	});
	document.addEventListener("keyup", (e) => 
	{
		if (e.key === "Shift") DUPLICATE_MODE = false;
	});
	document.addEventListener("touchstart", () => 
	{
		longPressTimer = setTimeout(() => 
		{
			DUPLICATE_MODE = true;
		}, 450); // half‑second long press
	});		
	document.addEventListener("touchend", () => 
	{
		clearTimeout(longPressTimer);
		DUPLICATE_MODE = false;
	});

	// ** End DUPLICATE EVENT
	document.body.classList.add("duplicate-mode");

    document.addEventListener('DOMContentLoaded', function() 
	{
		let lastLoadedMonth = null;
		let lastLoadedYear = null;
	 
		async function handleEventMove(info) 
		{
		    const event = info.event;
		
		    // Use the real SQL event ID
		    const id = event.id;
		
		    // New start time (full ISO)
		    const newStart = event.start;
		
		    // Find the event in monthData
		    const evt = monthData.events.find(e => e.id == id);
		    if (!evt) 
			{
				console.warn("No Evt found in monthData:", monthData.events);
		        console.warn("Event not found in monthData:", id);
		        return;
		    }
		
		    // If the event has an end date, preserve duration
		    if (evt.end) 
			{
		        const oldStart = new Date(evt.start);
		        const oldEnd = new Date(evt.end);
		        const duration = oldEnd - oldStart;
		        const newEnd = new Date(event.start.getTime() + duration);
		        evt.end = newEnd;
		    }
			
		    // Update local copy
		    evt.start = newStart;
		
		    // --- SQL WRITE-BACK ---
		    const payload = 
			{
		        Event_StartDate: evt.start,
		        Event_EndDate: evt.end || null
		    };
				
		    const res = await fetch(`${SUPABASE_URL}/Vac_Events?id=eq.${id}`,
			{
				method: "PATCH",
				headers: 
				{
					apikey: SUPABASE_KEY,
					"Content-Type": "application/json"
				},
				body: JSON.stringify(payload)
			});

		    if (!res.ok) 
			{
		        console.error("Failed to update event:", id);
		    } 
			else 
			{
		        console.log("Event updated:", id);
		    }
		}
		
		// Initialize the calendar 
		const calendarEl = document.getElementById("calendar");
		calendar = new FullCalendar.Calendar(calendarEl, 
		{
			initialView: 'dayGridMonth',
			headerToolbar: { left: 'prev',  center: 'title', right: 'next' },
			fixedWeekCount: false,
			showNonCurrentDates: false,
			editable: true,
			eventStartEditable: true,
			eventDurationEditable: true,
			eventResizableFromStart: true,
			eventResize: function(info) 
			{
    			handleEventResize(info);
			},
			eventClick: function(info) 
			{
				// Prevent FullCalendar from navigating to the URL automatically
				info.jsEvent.preventDefault();
				openViewEventPopup(info.event);
			},
			eventDidMount: function(info) 
			{
				const category = info.event.classNames[0];
				if (info.view.type.includes("list")) 
				{
			        const iconMap = 
					{
			            "event-flight": "✈️",
			            "event-meal": "🍽️",
			            "event-hotel": "🏨",
			            "event-trans": "🚗",
						"event-tour": "🏛️",
						"event-misc": "📌"
			        };
					const icon = iconMap[category];
			        if (icon) 
					{
	            		info.el.querySelector(".fc-list-event-title").setAttribute("data-icon", icon);
	        		}
				}
				info.el.dataset.category = category;
				if (!activeCategories[category]) 
				{
					info.el.style.opacity = activeCategories[category] ? "1" : "0";
				}
			},
			eventAdd: function() 
			{
			    updateSmartLegend();
			},
			eventChange: function() 
			{
			    updateSmartLegend();
			},
			eventRemove: function() 
			{
			    updateSmartLegend();
			},
			eventDrop: function(info) 
			{
			    if (READ_ONLY_MODE) 	    // Prevent duplication in read-only mode
				{
			        info.revert();
			        return;
			    }
				
			    // If not duplicating, normal drag behavior
			    if (DUPLICATE_MODE) 
				{
					saveDragDrop(info);			// DUPLICATE MODE: clone the event
				}
				else
				{
					handleEventMove(info);
				}
			},
			dateClick: function(info) 
			{
				if(!READ_ONLY_MODE)
    				openAddEventPopup(info.dateStr);
			},
			datesSet: function(info) 
			{
				const year = info.start.getFullYear();
				const month = info.end.getMonth();
			
				if (year !== lastLoadedYear || month !== lastLoadedMonth) 
				{
					lastLoadedYear = year;
					lastLoadedMonth = month;
					loadMonthEvents(info.start);
				}
				updateSmartLegend();
			},
			dayCellContent: function(arg) 
			{
				const dateStr = arg.date.toISOString().substring(0, 10);
				const location = data.dailyLocations[dateStr];
				const text = typeof location === "string" ? location : location?.text;
	
				if (!text) 
				{
					return { html: `<div class="fc-day-number">${arg.dayNumberText}</div>` };
				}
		
			    return { html: `<div class="day-location">${text}</div>
			                    <div class="fc-day-number">${arg.dayNumberText}</div>`
    				   };
			},
		});
		calendar.render();
		calendar.setOption("height", "auto");
		calendar.setOption("contentHeight", 700); // or whatever feels right

		//window.addEventListener('resize', applyResponsiveCalendarView);
		document.getElementById("toggle-view-btn").addEventListener("click", () => 
		{
		    const currentView = calendar.view.type;
			const icon = document.querySelector("#toggle-view-btn .toggle-icon");
		
		    if (currentView === "dayGridMonth") 
			{
		        calendar.changeView("listMonth");
				icon.textContent = "📋"; // switching to list
		    } else 
			{
		        calendar.changeView("dayGridMonth");
				icon.textContent = "📅"; // switching to month
		    }
		});

		//************** MODIFY TRIP TITLE **********				
		document.getElementById("trip-title").addEventListener("click", onTripHeaderClick);
		//************** end     MODIFY TRIP TITLE **********		

		document.getElementById("readonly-lock").addEventListener("click", () => 
		{
		    READ_ONLY_MODE = !READ_ONLY_MODE;
		    document.getElementById("editBanner").style.display = READ_ONLY_MODE ? "none" : "block";
		
		    const icon = document.getElementById("readonly-lock");
		    icon.textContent = READ_ONLY_MODE ? "🔒" : "✏️";	
		    applyReadOnlyMode();
		});

		// Load the current month’s trip
	    const today = new Date();
	    loadMonthEvents(today);
		
		document.getElementById('route-map-icon').addEventListener('click', () => 
		{
		    const mapSrc = document.getElementById('route-map-icon').dataset.mapSrc;
		    openMapPopup(mapSrc);
		});

		document.querySelectorAll('.legend-item').forEach(item => 
		{
			item.addEventListener('click', () => 
			{
				const category = item.dataset.category;
				// Toggle active state
				activeCategories[category] = !activeCategories[category];
		
				// Toggle visual style
				item.classList.toggle('inactive');
		
				const eventEls = document.querySelectorAll('.fc-event');
				eventEls.forEach(el => 
				{
					const eventCategory = el.dataset.category;
					if (!activeCategories[eventCategory]) 
					{
						el.style.display = "none";
					} 
					else 
					{
						el.style.display = "";
					}
				});			
			});
		});	
	});
